openapi: 3.1.0
info:
  title: 꼭꼭 백엔드 API (개발 초안)
  version: 0.1.0-draft
  summary: 사진 업로드, 단독 분석, 보호 편집, 누적 분석 개발 API
  description: >-
    이 문서는 현재 개발 서버 구현을 프론트 연동에 참고하도록 정리한 초안입니다.
    사용자 인증과 운영 파일 저장소는 확정되지 않았으므로 운영 API 명세로 취급하지 않습니다.
    누적 점수는 임시 규칙 버전을 사용하며 기본 분석·편집 드라이버는
    합성 또는 복사 결과만 내며 mock=true를 표시합니다.
servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버
security:
  - AppApiKey: []
tags:
  - name: 자산
  - name: 단독 분석
  - name: 다량 단독 분석
  - name: 보호 편집
  - name: 누적 분석
paths:
  /api/assets:
    post:
      tags: [자산]
      summary: 사진 업로드
      description: 원본 파일을 로컬 비공개 저장소에 저장하고 EXIF 촬영 시각·GPS를 추출합니다. 원시 GPS는 응답에 포함하지 않습니다.
      operationId: uploadAsset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
                  description: JPEG, PNG 또는 WebP, 최대 10 MB
                labels:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    maxLength: 40
                  description: "사진 분류 태그(예: 집, 회사). 위치 좌표나 민감 장소 데이터가 아닙니다. 반복 multipart 필드로 전달하며 추후 누적 분석에서 활용할 수 있습니다."
            encoding:
              labels:
                style: form
                explode: true
      responses:
        '201':
          description: 업로드 완료
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [자산]
      summary: 갤러리 목록
      operationId: listAssets
      responses:
        '200':
          description: 최근 업로드 순 자산 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Asset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [자산]
      summary: 자산 정보 조회
      operationId: getAsset
      responses:
        '200':
          description: 자산 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [자산]
      summary: 자산 삭제
      description: 자산 이미지 파일과 메타데이터를 삭제합니다. 파생 자산·분석 기록과의 전체 삭제 정책은 미정입니다.
      operationId: deleteAsset
      responses:
        '204': { description: 삭제 완료 }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/assets/{assetId}/content:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [자산]
      summary: 비공개 이미지 내용 조회
      operationId: getAssetContent
      responses:
        '200':
          description: 저장된 이미지 바이트
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/assets/{assetId}/labels:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    put:
      tags: [자산]
      summary: 사진 태그 교체
      operationId: replaceAssetLabels
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetLabelsRequest' }
      responses:
        '200':
          description: 변경된 자산 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/inspections:
    post:
      tags: [단독 분석]
      summary: 저장된 사진 단독 분석 시작
      description: >-
        저장된 자산 한 개의 단독 분석을 시작합니다. EXIF GPS가 없는 경우에만
        locationFallback에 사용자가 입력한 촬영 위치를 전달할 수 있습니다.
        EXIF GPS가 있으면 서버가 우선하고 수동 입력값은 무시합니다.
        사진 태그는 자산에 보관하고 분석 요청에는 별도로 포함하지 않습니다.
        여러 사진은 각 자산마다 이 API를 따로 호출하며 묶음 점수는 계산하지 않습니다.
        서버가 읽은 EXIF 메타데이터를 실제 분석 드라이버에 전달하는 형식은 파이프라인 합의 전까지 미정입니다.
      operationId: createInspection
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectionRequest' }
      responses:
        '202':
          description: 분석 요청 접수
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [단독 분석]
      summary: 사진별 분석 이력 조회
      description: 상태는 서버에 마지막으로 기록된 값이며 Node 상태를 자동으로 일괄 조회하지 않습니다.
      operationId: listInspectionsByAsset
      parameters:
        - name: assetId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 최근 요청 순 분석 작업 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InspectionHistoryItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/inspection-batches:
    post:
      tags: [다량 단독 분석]
      summary: 여러 사진을 각각 단독 분석 시작
      description: >-
        사진은 최대 20장까지 받으며 한 장씩 기존 단독 분석을 실행합니다.
        사진 간 비교·공동 추론·누적 점수 계산은 하지 않습니다. 각 사진의 EXIF GPS가
        있으면 서버가 우선하고, 없으면 그 사진 항목의 locationFallback을 사용합니다.
        같은 Idempotency-Key와 같은 입력은 기존 묶음을 반환합니다.
      operationId: createInspectionBatch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectionBatchRequest' }
      responses:
        '202':
          description: 묶음 분석 접수
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/inspection-batches/{batchId}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [다량 단독 분석]
      summary: 묶음 분석과 사진별 상태 조회
      description: >-
        사진별 기존 단독 분석 상태를 갱신해 반환합니다. 일시적인 분석 서버 오류가
        발생하면 마지막으로 확인한 사진별 상태를 유지합니다. 일부 사진 실패는 다른 결과를 숨기지 않습니다.
      operationId: getInspectionBatch
      responses:
        '200':
          description: 묶음 및 항목별 진행 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionBatch' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/inspections/{inspectionId}:
    parameters:
      - name: inspectionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [단독 분석]
      summary: 분석 상태와 결과 조회
      operationId: getInspection
      responses:
        '200':
          description: 현재 분석 결과. provider 상세 필드는 파이프라인 계약이 정해질 때까지 유동적입니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/edits:
    post:
      tags: [보호 편집]
      summary: 단서 선택 편집 요청
      description: 기본 stub은 원본을 복사하며, EDITING_PROVIDER=openai일 때 선택된 단서 bbox들을 합친 mask로 실제 이미지 편집을 요청합니다.
      operationId: createEdit
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditRequest' }
      responses:
        '201':
          description: 편집 작업 완료. 응답의 mock 필드로 모의 결과 여부를 확인합니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/edits/{editId}:
    parameters:
      - name: editId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [보호 편집]
      summary: 편집 작업 조회
      operationId: getEdit
      responses:
        '200':
          description: 편집·재검사 연결 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/assets/{assetId}/capture-location:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    put:
      tags: [자산]
      summary: EXIF가 없는 사진의 촬영 위치 저장
      description: 원본 EXIF를 덮어쓰지 않고 사용자가 직접 입력한 좌표를 별도로 보관합니다. 좌표는 응답에서 숨깁니다.
      operationId: setManualCaptureLocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureLocationRequest' }
      responses:
        '200':
          description: 촬영 위치 출처가 manual로 표시된 사진
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/places:
    get:
      tags: [누적 분석]
      summary: 이 앱 설치에 등록된 민감 장소 목록
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      responses:
        '200':
          description: 민감 좌표를 제외한 장소 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SensitivePlace' }
    post:
      tags: [누적 분석]
      summary: 민감 장소 등록
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensitivePlaceRequest' }
      responses:
        '201':
          description: 등록된 장소 (GPS 좌표는 응답에서 제외)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensitivePlace' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/places/{placeId}:
    parameters:
      - name: placeId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/InstallationId'
    get:
      tags: [누적 분석]
      summary: 민감 장소 조회
      responses:
        '200':
          description: 민감 좌표를 제외한 장소 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensitivePlace' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [누적 분석]
      summary: 민감 장소 정보 변경
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensitivePlaceRequest' }
      responses:
        '200':
          description: 변경된 장소 (좌표는 응답에서 제외)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensitivePlace' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [누적 분석]
      summary: 민감 장소와 누적 실행 기록 삭제
      responses:
        '204': { description: 삭제 완료 }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/places/{placeId}/assets:
    parameters:
      - name: placeId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/InstallationId'
    get:
      tags: [누적 분석]
      summary: 장소에 연결된 저장 사진 목록
      responses:
        '200':
          description: 원시 촬영 좌표를 제외한 사진 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlaceAsset' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [누적 분석]
      summary: 저장 사진을 민감 장소에 연결
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceAssetRequest' }
      responses:
        '200':
          description: 장소에 연결된 사진
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceAsset' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/places/{placeId}/assets/{assetId}:
    parameters:
      - name: placeId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/InstallationId'
    delete:
      tags: [누적 분석]
      summary: 민감 장소에서 사진 연결 해제
      responses:
        '204': { description: 연결 해제 완료 }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/cumulative-runs:
    post:
      tags: [누적 분석]
      summary: 저장된 단독 검사 결과로 누적 분석 실행
      description: >-
        사진별 최신 완료 검사 결과를 사용합니다. EXIF가 없는 사진은 별도의 촬영 좌표가 필요합니다.
        중심 후보(medoid)에서 100m 이내인 사진을 묶고 결과 스냅샷을 저장합니다. 점수는
        cumulative-score-v1-provisional이며 확률이 아닌 임시 상대 점수입니다. 등록 장소와 촬영 좌표는 응답에 포함하지 않습니다.
      parameters:
        - $ref: '#/components/parameters/InstallationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CumulativeRunRequest' }
      responses:
        '201':
          description: 저장된 누적 분석 결과 스냅샷
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CumulativeRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/cumulative-runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/InstallationId'
    get:
      tags: [누적 분석]
      summary: 저장된 누적 분석 결과 조회
      responses:
        '200':
          description: 실행 당시 결과 스냅샷
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CumulativeRun' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/cumulative-runs/place/{placeId}:
    parameters:
      - name: placeId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/InstallationId'
    get:
      tags: [누적 분석]
      summary: 장소별 누적 분석 이력 조회
      responses:
        '200':
          description: 최신 실행 순 결과 스냅샷 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CumulativeRun' }
        '404': { $ref: '#/components/responses/NotFound' }
  /actuator/health:
    get:
      summary: Spring 서버 상태
      security: []
      responses:
        '200':
          description: 서버 헬스 상태. 분석 서버 가용성을 보장하지 않습니다.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    AppApiKey:
      type: apiKey
      in: header
      name: X-App-Api-Key
      description: 단일 사용자 개발용 공유 키. 사용자 인증·데이터 격리를 제공하지 않습니다.
  parameters:
    InstallationId:
      name: X-Installation-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: 앱 설치 시 생성해 로컬에 보관하는 파일럿 사용자 식별자. 로그인 인증을 대신하지 않습니다.
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: 입력값 형식 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: API 키 누락 또는 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 자산·작업 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 중복 요청 키 충돌 또는 처리 중인 작업
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooLarge:
      description: 파일이 허용 용량을 초과함
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMedia:
      description: 지원하지 않는 사진 형식
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    Asset:
      type: object
      required: [assetId, contentType, sizeBytes, locationStatus, capturedAt, labels, assetRole, parentAssetId, mock, createdAt]
      properties:
        assetId: { type: string, format: uuid }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, format: int64 }
        locationStatus: { type: string, enum: [available, unavailable, manual] }
        capturedAt:
          type: [string, 'null']
          description: EXIF에 기록된 현지 촬영 시각. 시간대는 포함하지 않습니다.
        labels:
          type: array
          description: 사진에 붙이는 분류 태그. 위치 좌표나 민감 장소를 의미하지 않습니다.
          items: { type: string }
        assetRole: { type: string, enum: [original, edited] }
        parentAssetId: { type: [string, 'null'], format: uuid }
        mock: { type: boolean, description: true when this asset was produced by a mock driver }
        createdAt: { type: string, format: date-time }
    AssetLabelsRequest:
      type: object
      required: [labels]
      properties:
        labels:
          type: array
          maxItems: 10
          description: "사진에 붙이는 분류 태그(예: 집, 회사). 추후 누적 분석에서 활용할 수 있습니다."
          items: { type: string, minLength: 1, maxLength: 40 }
    CaptureLocationRequest:
      type: object
      required: [latitude, longitude, source]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        source: { type: string, enum: [manual] }
    SensitivePlaceRequest:
      type: object
      required: [name, category, latitude, longitude]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        category: { type: string, enum: [home, work, school, other] }
        latitude: { type: number, minimum: -90, maximum: 90, writeOnly: true }
        longitude: { type: number, minimum: -180, maximum: 180, writeOnly: true }
        radiusMeters: { type: integer, enum: [100, 300, 500, 1000], default: 300 }
    SensitivePlace:
      type: object
      required: [placeId, name, category, radiusMeters, createdAt]
      properties:
        placeId: { type: string, format: uuid }
        name: { type: string }
        category: { type: string, enum: [home, work, school, other] }
        radiusMeters: { type: integer, enum: [100, 300, 500, 1000] }
        createdAt: { type: string, format: date-time }
    PlaceAssetRequest:
      type: object
      required: [assetId]
      properties:
        assetId: { type: string, format: uuid }
    PlaceAsset:
      type: object
      required: [assetId, contentType, sizeBytes, locationStatus, labels, assetRole, mock, createdAt]
      properties:
        assetId: { type: string, format: uuid }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        locationStatus: { type: string, enum: [found, unavailable, manual] }
        capturedAt: { type: [string, 'null'], format: date-time }
        labels: { type: array, items: { type: string } }
        assetRole: { type: string, enum: [original, edited] }
        mock: { type: boolean }
        createdAt: { type: string, format: date-time }
    CumulativeRunRequest:
      type: object
      required: [placeId, assetIds]
      properties:
        placeId: { type: string, format: uuid }
        assetIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    CumulativeRun:
      type: object
      required: [runId, placeId, algorithmVersion, scoreStatus, riskLevel, groups, excluded, createdAt]
      properties:
        runId: { type: string, format: uuid }
        placeId: { type: string, format: uuid }
        algorithmVersion: { type: string, example: cumulative-score-v1-provisional }
        score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        scoreMeaning: { type: string, example: relative_score_not_probability }
        scoreStatus: { type: string, enum: [calculated, not_assessed] }
        scoreNotice: { type: string }
        riskLevel: { type: string, enum: [low, caution, high, not_assessed] }
        repeatComponent: { type: number }
        combinationComponent: { type: number }
        groups: { type: array, items: { type: object, additionalProperties: true } }
        excluded: { type: array, items: { type: object, additionalProperties: true } }
        createdAt: { type: string, format: date-time }
    InspectionRequest:
      type: object
      description: 저장된 사진 자산 한 개를 분석합니다. 사진 태그는 이 요청에 포함하지 않습니다. EXIF GPS가 없을 때 locationFallback으로 촬영 위치를 보완할 수 있습니다.
      required: [assetId]
      properties:
        assetId: { type: string, format: uuid }
        locationFallback:
          type: string
          maxLength: 120
          description: EXIF GPS가 없을 때만 사용하는 사용자의 촬영 위치 입력. 지도 검색/지오코딩은 지원하지 않음.
    InspectionBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: 사진별 독립 단독 분석 요청. assetId는 중복될 수 없습니다.
          items:
            type: object
            required: [assetId]
            properties:
              assetId: { type: string, format: uuid }
              locationFallback:
                type: string
                maxLength: 120
                description: 해당 사진에 EXIF GPS가 없을 때만 사용하는 촬영 위치 입력.
    InspectionBatch:
      type: object
      required: [batchId, status, mock, items]
      properties:
        batchId: { type: string, format: uuid }
        status: { type: string, enum: [queued, processing, completed, partial, failed] }
        mock: { type: boolean, description: 묶음 중 모의 드라이버 결과가 하나 이상이면 true }
        items:
          type: array
          items: { $ref: '#/components/schemas/InspectionBatchItem' }
    InspectionBatchItem:
      type: object
      required: [assetId, status, mock, requestedAt, updatedAt]
      properties:
        assetId: { type: string, format: uuid }
        inspectionId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [submitting, queued, processing, completed, failed] }
        errorCode: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        mock: { type: boolean }
        requestedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InspectionAccepted:
      type: object
      required: [inspectionId, assetId, status]
      properties:
        inspectionId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        status: { type: string, enum: [queued, processing, completed, failed] }
        mock: { type: boolean }
        pipelineVersion: { type: string }
        riskSummary: { type: object, additionalProperties: true }
        riskFactors:
          type: array
          description: 단서 bbox는 [x1,y1,x2,y2] 순서, 0~1 정규화, EXIF 방향 보정 이미지 기준입니다.
          items: { type: object, additionalProperties: true }
    InspectionHistoryItem:
      type: object
      required: [assetId, status, requestedAt, updatedAt]
      properties:
        inspectionId: { type: [string, 'null'], format: uuid }
        assetId: { type: string, format: uuid }
        status: { type: string, enum: [submitting, queued, processing, completed, failed] }
        requestedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InspectionResult:
      type: object
      required: [inspectionId, status]
      properties:
        inspectionId: { type: string, format: uuid }
        assetId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [queued, processing, completed, failed] }
        mock: { type: boolean }
        pipelineVersion: { type: string }
        mockNotice: { type: string }
        riskSummary: { type: object, additionalProperties: true }
        riskFactors: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: true
    EditRequest:
      type: object
      required: [inspectionId, cueIds]
      properties:
        inspectionId: { type: string, format: uuid }
        cueIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
        preservePrompt: { type: [string, 'null'], maxLength: 1000 }
        editStrength:
          type: integer
          minimum: 0
          maximum: 100
          default: 50
          description: 편집 변화 강도. 이미지 출력 품질 설정과 별개입니다.
    EditResult:
      type: object
      required: [editId, inspectionId, sourceAssetId, cueIds, status, mock, createdAt, updatedAt]
      properties:
        editId: { type: string, format: uuid }
        inspectionId: { type: string, format: uuid }
        sourceAssetId: { type: string, format: uuid }
        editedAssetId: { type: [string, 'null'], format: uuid }
        verificationInspectionId: { type: [string, 'null'], format: uuid }
        verificationStatus: { type: string, enum: [not_started, queued, processing, completed, failed] }
        cueIds: { type: array, items: { type: string } }
        status: { type: string, enum: [processing, completed, failed] }
        mock: { type: boolean }
        mockNotice: { type: [string, 'null'] }
        providerVersion: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
