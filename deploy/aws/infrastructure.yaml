AWSTemplateFormatVersion: '2010-09-09'
Description: 'KkokKkok private CPU pilot. PREPARATION ONLY: creating this stack incurs AWS charges.'
Parameters:
  ProjectName:
    Type: String
    Default: kkokkkok-pilot
    AllowedPattern: '[a-z][a-z0-9-]{2,28}'
  AppInstanceType:
    Type: String
    Default: t3.medium
  AnalysisInstanceType:
    Type: String
    Default: m7i.xlarge
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.small
  PostgresVersion:
    Type: String
    Default: ''
    AllowedPattern: ^$|[0-9]+\.[0-9]+(\.[0-9]+)?$
    Description: Confirm a supported PostgreSQL major/minor in the selected region before provisioning.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: Use the existing token.actions.githubusercontent.com provider if the account already has one.
  BackendRepository:
    Type: String
    Default: KkokKkok/kkokkkok-backend
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
Conditions:
  CreateGitHubProvider:
    Fn::Equals:
    - !Ref 'ExistingGitHubOidcProviderArn'
    - ''
  UseExplicitPostgres:
    Fn::Not:
    - Fn::Equals:
      - !Ref 'PostgresVersion'
      - ''
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
      - Key: Project
        Value: !Ref 'ProjectName'
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
      - Key: Project
        Value: !Ref 'ProjectName'
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref 'Vpc'
      InternetGatewayId: !Ref 'InternetGateway'
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref 'Vpc'
      CidrBlock: 10.42.0.0/24
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Project
        Value: !Ref 'ProjectName'
  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref 'Vpc'
      CidrBlock: 10.42.10.0/24
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Project
        Value: !Ref 'ProjectName'
  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref 'Vpc'
      CidrBlock: 10.42.11.0/24
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Project
        Value: !Ref 'ProjectName'
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref 'Vpc'
      Tags:
      - Key: Project
        Value: !Ref 'ProjectName'
  InternetRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref 'PublicRoutes'
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref 'InternetGateway'
    DependsOn: GatewayAttachment
  PublicRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref 'PublicSubnet'
      RouteTableId: !Ref 'PublicRoutes'
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AppSecurityGroup
      VpcId: !Ref 'Vpc'
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      Tags:
      - Key: Project
        Value: !Ref 'ProjectName'
  AnalysisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AnalysisSecurityGroup
      VpcId: !Ref 'Vpc'
      SecurityGroupIngress: []
      Tags:
      - Key: Project
        Value: !Ref 'ProjectName'
  AnalysisIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref 'AnalysisSecurityGroup'
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref 'AppSecurityGroup'
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from application only
      VpcId: !Ref 'Vpc'
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        SourceSecurityGroupId: !Ref 'AppSecurityGroup'
      Tags:
      - Key: Project
        Value: !Ref 'ProjectName'
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private database subnets
      SubnetIds:
      - !Ref 'DatabaseSubnetA'
      - !Ref 'DatabaseSubnetB'
  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      EngineVersion:
        Fn::If:
        - UseExplicitPostgres
        - !Ref 'PostgresVersion'
        - !Ref 'AWS::NoValue'
      DBInstanceClass: !Ref 'DatabaseInstanceClass'
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      DBName: kkokkkok
      MasterUsername: kkokkkok
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref 'DatabaseSubnets'
      VPCSecurityGroups:
      - !Ref 'DatabaseSecurityGroup'
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags:
      - Key: Project
        Value: !Ref 'ProjectName'
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
  Photos:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
        - Id: AbortIncompleteUpload
          Status: Enabled
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 7
      Tags:
      - Key: Project
        Value: !Ref 'ProjectName'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  PhotosTls:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref 'Photos'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - !GetAtt 'Photos.Arn'
          - !Sub '${Photos.Arn}/*'
          Condition:
            Bool:
              aws:SecureTransport: 'false'
  BackendImages:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}-backend'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
      - Key: Project
        Value: !Ref 'ProjectName'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  AnalysisImages:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}-analysis'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
      - Key: Project
        Value: !Ref 'ProjectName'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  VisionImages:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}-vision'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
      - Key: Project
        Value: !Ref 'ProjectName'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  RuntimeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Pilot runtime credentials. Owner must add OPENAI_API_KEY before real inference.
      GenerateSecretString:
        SecretStringTemplate: '{"OPENAI_API_KEY": ""}'
        GenerateStringKey: INTERNAL_API_KEY
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
      - Key: Project
        Value: !Ref 'ProjectName'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
      - PolicyName: Runtime
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action:
            - ecr:BatchGetImage
            - ecr:GetDownloadUrlForLayer
            - ecr:BatchCheckLayerAvailability
            Resource:
            - !GetAtt 'BackendImages.Arn'
            - !GetAtt 'AnalysisImages.Arn'
            - !GetAtt 'VisionImages.Arn'
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
            - !Ref 'RuntimeSecret'
            - !GetAtt 'Database.MasterUserSecret.SecretArn'
          - Effect: Allow
            Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:DeleteObjectVersion
            Resource: !Sub '${Photos.Arn}/assets/*'
          - Effect: Allow
            Action: s3:ListBucketVersions
            Resource: !GetAtt 'Photos.Arn'
            Condition:
              StringLike:
                s3:prefix: 'assets/*'
  AppProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - !Ref 'AppRole'
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref 'AmiId'
        InstanceType: !Ref 'AppInstanceType'
        IamInstanceProfile:
          Arn: !GetAtt 'AppProfile.Arn'
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 60
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: false
        NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref 'PublicSubnet'
          Groups:
          - !Ref 'AppSecurityGroup'
        UserData:
          Fn::Base64: '#!/bin/bash

            set -euo pipefail

            umask 077

            dnf install -y docker python3 curl jq

            if ! command -v aws >/dev/null; then dnf install -y awscli-2; fi

            systemctl enable --now docker amazon-ssm-agent

            mkdir -p /usr/local/lib/docker/cli-plugins /opt/kkokkkok

            cd /opt/kkokkkok

            curl -fsSLO https://github.com/docker/compose/releases/download/v5.7.0/docker-compose-linux-x86_64

            curl -fsSLO https://github.com/docker/compose/releases/download/v5.7.0/docker-compose-linux-x86_64.sha256

            sha256sum -c docker-compose-linux-x86_64.sha256

            install -m 0755 docker-compose-linux-x86_64 /usr/local/lib/docker/cli-plugins/docker-compose

            rm docker-compose-linux-x86_64 docker-compose-linux-x86_64.sha256

            docker compose version

            '
        TagSpecifications:
        - ResourceType: instance
          Tags:
          - Key: Project
            Value: !Ref 'ProjectName'
          - Key: DeploymentRole
            Value: app
  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref 'AppLaunchTemplate'
        Version: !GetAtt 'AppLaunchTemplate.LatestVersionNumber'
    DependsOn: InternetRoute
  AnalysisRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
      - PolicyName: Runtime
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action:
            - ecr:BatchGetImage
            - ecr:GetDownloadUrlForLayer
            - ecr:BatchCheckLayerAvailability
            Resource:
            - !GetAtt 'BackendImages.Arn'
            - !GetAtt 'AnalysisImages.Arn'
            - !GetAtt 'VisionImages.Arn'
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
            - !Ref 'RuntimeSecret'
  AnalysisProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - !Ref 'AnalysisRole'
  AnalysisLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref 'AmiId'
        InstanceType: !Ref 'AnalysisInstanceType'
        IamInstanceProfile:
          Arn: !GetAtt 'AnalysisProfile.Arn'
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 120
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: false
        NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref 'PublicSubnet'
          Groups:
          - !Ref 'AnalysisSecurityGroup'
        UserData:
          Fn::Base64: '#!/bin/bash

            set -euo pipefail

            umask 077

            dnf install -y docker python3 curl jq

            if ! command -v aws >/dev/null; then dnf install -y awscli-2; fi

            systemctl enable --now docker amazon-ssm-agent

            mkdir -p /usr/local/lib/docker/cli-plugins /opt/kkokkkok

            cd /opt/kkokkkok

            curl -fsSLO https://github.com/docker/compose/releases/download/v5.7.0/docker-compose-linux-x86_64

            curl -fsSLO https://github.com/docker/compose/releases/download/v5.7.0/docker-compose-linux-x86_64.sha256

            sha256sum -c docker-compose-linux-x86_64.sha256

            install -m 0755 docker-compose-linux-x86_64 /usr/local/lib/docker/cli-plugins/docker-compose

            rm docker-compose-linux-x86_64 docker-compose-linux-x86_64.sha256

            docker compose version

            '
        TagSpecifications:
        - ResourceType: instance
          Tags:
          - Key: Project
            Value: !Ref 'ProjectName'
          - Key: DeploymentRole
            Value: analysis
  AnalysisInstance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref 'AnalysisLaunchTemplate'
        Version: !GetAtt 'AnalysisLaunchTemplate.LatestVersionNumber'
    DependsOn: InternetRoute
  AppAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  AppAddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref 'AppInstance'
      AllocationId: !GetAtt 'AppAddress.AllocationId'
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
      - sts.amazonaws.com
    Condition: CreateGitHubProvider
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Federated:
              Fn::If:
              - CreateGitHubProvider
              - !Ref 'GitHubProvider'
              - !Ref 'ExistingGitHubOidcProviderArn'
          Action: sts:AssumeRoleWithWebIdentity
          Condition:
            StringEquals:
              token.actions.githubusercontent.com:aud: sts.amazonaws.com
              token.actions.githubusercontent.com:sub: !Sub 'repo:${BackendRepository}:ref:refs/heads/main'
      MaxSessionDuration: 3600
      Policies:
      - PolicyName: PublishAndDeploy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action:
            - ecr:BatchCheckLayerAvailability
            - ecr:InitiateLayerUpload
            - ecr:UploadLayerPart
            - ecr:CompleteLayerUpload
            - ecr:PutImage
            Resource:
            - !GetAtt 'BackendImages.Arn'
            - !GetAtt 'AnalysisImages.Arn'
            - !GetAtt 'VisionImages.Arn'
          - Effect: Allow
            Action: ssm:SendCommand
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript'
          - Effect: Allow
            Action: ssm:SendCommand
            Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
            Condition:
              StringEquals:
                ssm:resourceTag/Project: !Ref 'ProjectName'
          - Effect: Allow
            Action: ssm:GetCommandInvocation
            Resource: '*'
Outputs:
  Region:
    Value: !Ref 'AWS::Region'
  AppInstanceId:
    Value: !Ref 'AppInstance'
  AnalysisInstanceId:
    Value: !Ref 'AnalysisInstance'
  AppPublicIp:
    Value: !Ref 'AppAddress'
  AnalysisPrivateIp:
    Value: !GetAtt 'AnalysisInstance.PrivateIp'
  DatabaseEndpoint:
    Value: !GetAtt 'Database.Endpoint.Address'
  DatabaseSecretArn:
    Value: !GetAtt 'Database.MasterUserSecret.SecretArn'
  RuntimeSecretArn:
    Value: !Ref 'RuntimeSecret'
  PhotoBucket:
    Value: !Ref 'Photos'
  DeployRoleArn:
    Value: !GetAtt 'DeployRole.Arn'
  BackendRepositoryUri:
    Value: !GetAtt 'BackendImages.RepositoryUri'
  AnalysisRepositoryUri:
    Value: !GetAtt 'AnalysisImages.RepositoryUri'
  VisionRepositoryUri:
    Value: !GetAtt 'VisionImages.RepositoryUri'
