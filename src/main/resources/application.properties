spring.application.name=backend
spring.config.import=optional:file:.env[.properties]
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
analysis.provider=${ANALYSIS_PROVIDER:stub}
editing.provider=${EDITING_PROVIDER:stub}
editing.openai.api-key=${OPENAI_API_KEY:}
editing.openai.model=${OPENAI_IMAGE_MODEL:gpt-image-2.5-sunburst}
editing.openai.quality=${OPENAI_IMAGE_QUALITY:high}
editing.openai.timeout-seconds=${OPENAI_IMAGE_TIMEOUT_SECONDS:300}
analysis.base-url=${NODE_ANALYSIS_BASE_URL:}
analysis.api-key=${NODE_ANALYSIS_API_KEY:}
analysis.external-image-consent=${NODE_ANALYSIS_EXTERNAL_IMAGE_CONSENT:false}
analysis.timeout-seconds=${NODE_ANALYSIS_TIMEOUT_SECONDS:30}
app.api-key=${APP_API_KEY:}
management.endpoints.web.exposure.include=health
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL:jdbc:h2:file:./private-data/backend}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
assets.storage-root=${ASSET_STORAGE_ROOT:./private-data/assets}

# H2/local development retains Hibernate initialization. Deployment uses the postgres profile.
spring.flyway.enabled=false

assets.provider=${ASSET_STORAGE_PROVIDER:local}
assets.s3.bucket=${ASSET_S3_BUCKET:}
assets.s3.region=${AWS_REGION:ap-northeast-2}
assets.s3.prefix=${ASSET_S3_PREFIX:assets/}
# Endpoint override is only for local S3-compatible contract testing.
assets.s3.endpoint=${ASSET_S3_ENDPOINT:}
assets.s3.path-style=${ASSET_S3_PATH_STYLE:false}

# Kakao Local API (address/place search for the map UI). Server-side REST key only.
kakao.local.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.local.base-url=${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
kakao.local.timeout-seconds=${KAKAO_LOCAL_TIMEOUT_SECONDS:5}

# Login mode (Kakao). Replaces the shared app key and pilot invite access; never combine with app.pilot.enabled.
app.auth.enabled=${AUTH_ENABLED:false}
auth.kakao.app-id=${KAKAO_APP_ID:}
auth.kakao.base-url=${KAKAO_AUTH_BASE_URL:https://kapi.kakao.com}
auth.kakao.timeout-seconds=${KAKAO_AUTH_TIMEOUT_SECONDS:5}
auth.access-token-minutes=${AUTH_ACCESS_TOKEN_MINUTES:60}
auth.refresh-token-days=${AUTH_REFRESH_TOKEN_DAYS:30}
# Development migration only: move places/photos saved under the logging-in app installation id to the user.
auth.link-installation-data=${AUTH_LINK_INSTALLATION_DATA:false}
