spring.application.name=backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
analysis.base-url=${NODE_ANALYSIS_BASE_URL:}
analysis.api-key=${NODE_ANALYSIS_API_KEY:}
analysis.timeout-seconds=${NODE_ANALYSIS_TIMEOUT_SECONDS:30}
app.api-key=${APP_API_KEY:}
management.endpoints.web.exposure.include=health
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL:jdbc:h2:file:./private-data/backend}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
assets.storage-root=${ASSET_STORAGE_ROOT:./private-data/assets}
