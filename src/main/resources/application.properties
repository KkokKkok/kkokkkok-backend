spring.application.name=backend
spring.config.import=optional:file:.env[.properties]
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
analysis.provider=${ANALYSIS_PROVIDER:stub}
editing.provider=${EDITING_PROVIDER:stub}
editing.openai.api-key=${OPENAI_API_KEY:}
editing.openai.model=${OPENAI_IMAGE_MODEL:gpt-image-2.5-sunburst}
editing.openai.quality=${OPENAI_IMAGE_QUALITY:high}
editing.openai.timeout-seconds=${OPENAI_IMAGE_TIMEOUT_SECONDS:300}
analysis.base-url=${NODE_ANALYSIS_BASE_URL:}
analysis.api-key=${NODE_ANALYSIS_API_KEY:}
analysis.external-image-consent=${NODE_ANALYSIS_EXTERNAL_IMAGE_CONSENT:false}
analysis.timeout-seconds=${NODE_ANALYSIS_TIMEOUT_SECONDS:30}
app.api-key=${APP_API_KEY:}
management.endpoints.web.exposure.include=health
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL:jdbc:h2:file:./private-data/backend}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
assets.storage-root=${ASSET_STORAGE_ROOT:./private-data/assets}

# H2/local development retains Hibernate initialization. Deployment uses the postgres profile.
spring.flyway.enabled=false
