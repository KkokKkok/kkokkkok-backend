<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>꼭꼭 보호 편집 테스트</title>
    <link rel="stylesheet" href="/style.css">
    <script defer src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">LOCAL IMAGE EDIT EVALUATION</p>
        <h1>보호 편집 테스트</h1>
      </div>
      <nav class="top-nav" aria-label="페이지 이동">
        <a class="nav-link" href="/results">이전 결과</a>
        <span class="local-badge">내 컴퓨터에서만 실행</span>
      </nav>
    </header>

    <main>
      <section class="panel setup-panel">
        <div class="section-heading">
          <div>
            <p class="step">1단계</p>
            <h2>사진과 수정 대상을 정해요</h2>
          </div>
          <p class="help">사진과 요청은 OpenAI API로 전송됩니다. 입력과 결과는 저장소가 아닌 Downloads에 저장됩니다.</p>
        </div>

        <form id="mask-form">
          <label class="field">
            <span>사진</span>
            <input name="image" type="file" accept="image/jpeg,image/png,image/webp" required>
            <small>JPG, PNG, WebP · 최대 50MB</small>
            <img id="selected-image-preview" class="selected-image-preview hidden" alt="선택한 사진 미리보기">
          </label>
          <label class="field">
            <span>수정할 대상</span>
            <textarea name="target" rows="4" maxlength="1500" required placeholder="사진 위쪽 간판의 상호 글자&#10;컵에 인쇄된 로고"></textarea>
            <small>한 줄에 하나씩 입력해요. 대상별로 수정 영역을 찾아 합친 뒤, 한 번의 편집 요청으로 함께 수정합니다. 최대 8개</small>
          </label>
          <div class="actions">
            <button id="mask-button" class="button primary" type="submit">수정 영역 찾기</button>
            <span id="mask-status" class="status" role="status"></span>
          </div>
        </form>
      </section>

      <section id="active-session" class="panel hidden" aria-live="polite"></section>
    </main>

    <footer>
      <span>실제 사진과 API 키는 Git에 포함되지 않습니다.</span>
      <span>Ctrl+C로 로컬 서버를 종료할 수 있습니다.</span>
    </footer>
  </body>
</html>
